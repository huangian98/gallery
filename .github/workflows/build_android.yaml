  name: Build Android APK
  
  on:
    workflow_dispatch:
    push:
      branches: [ "main", "feat/offline-companion" ]
      paths:
        - 'Android/**'
        - '.github/workflows/build_android.yaml'
    pull_request:
      branches: [ "main" ]
      paths:
        - 'Android/**'
        - '.github/workflows/build_android.yaml'
  
  jobs:
    build_apk:
      name: Build Android APK
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: ./Android/src
      steps:
        - name: Checkout the source code
          uses: actions/checkout@v3
        - uses: actions/setup-java@v4
          with:
            distribution: 'temurin'
            java-version: '21'
        - name: Install Android SDK Platform 37
          run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0"
        - name: Build
          run: ./gradlew :app:testDebugUnitTest :app:assembleRelease
        - name: Upload installable APK
          uses: actions/upload-artifact@v4
          with:
            name: gallery-companion-apk
            path: Android/src/app/build/outputs/apk/release/*.apk
        - name: Upload unit test results
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: unit-test-results
            path: Android/src/app/build/reports/tests/testDebugUnitTest/
  
  
